<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FastMart Electronics</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px;">
  <h1>FastMart Electronics</h1>
  
  <div style="border: 1px solid #ccc; padding: 16px; border-radius: 8px; text-align: center;">
    <!-- Product Image -->
    <img src="headphones.jpg" alt="ProMax Wireless Headphones" style="max-width: 100%; height: auto; border-radius: 4px;" />
    
    <h2 id="product-name">ProMax Wireless Headphones</h2>
    
    <!-- Dynamic Price Container -->
    <p style="font-size: 24px; font-weight: bold; color: #2e7d32;">
      Price: $<span id="product-price">Loading...</span>
    </p>
    
    <p style="color: #555;">In stock — ships globally</p>
    <p style="font-size: 14px;"><a href="prices.json" target="_blank">View raw prices.json API feed →</a></p>
  </div>

  <p style="margin-top: 24px;">
    <a href="/eu-exclusive.html">View EU-exclusive product →</a>
  </p>

  <!-- Fetch API script to pull JSON price feed -->
  <script>
    fetch('prices.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        // Update the price dynamically from JSON feed
        if (data && data.price) {
          document.getElementById('product-price').textContent = data.price.toFixed(2);
        }
      })
      .catch(error => {
        console.error('Error fetching price feed:', error);
        // Fallback display if fetch fails
        document.getElementById('product-price').textContent = '299.99';
      });
  </script>
</body>
</html>
